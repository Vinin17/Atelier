<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · ATELIER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.tema = localStorage.getItem('tema') || 'claro';</script>
</head>
<body data-pagina="login" class="login-pagina">
  <header class="topo escuro">
    <div class="esquerda"><button class="icone" onclick="history.back()" aria-label="Voltar"><i class="bi bi-chevron-left"></i></button></div>
    <a href="index.html" class="marca">ATELIER<span>.</span></a>
    <div class="direita">
      
      <a href="favoritos.html" class="icone so-desktop" aria-label="Favoritos"><i class="bi bi-heart"></i></a>
      <a href="conta.html" class="icone so-desktop" aria-label="Minha conta"><i class="bi bi-person"></i></a>
      <a href="checkout.html" class="icone" aria-label="Sacola"><i class="bi bi-bag"></i><span class="contador">0</span></a>
    </div>
  </header>

  <section class="login-hero">
    <img src="img/Login.png" alt="" onerror="this.remove()">
    <small>Círculo Atelier</small>
    <h2>Acesso reservado a quem aprecia cada detalhe.</h2>
  </section>

  <section class="login-folha">
    <h1>Bem-vindo de volta</h1>
    <p>Entre para acompanhar pedidos, favoritos e lançamentos exclusivos.</p>

    <form onsubmit="entrar(event)" novalidate>
      <label for="email">E-mail</label>
      <div class="campo-icone">
        <input type="email" id="email" placeholder="nome@exemplo.com">
        <i class="bi bi-envelope"></i>
      </div>

      <label for="senha">Senha</label>
      <div class="campo-icone">
        <input type="password" id="senha" placeholder="••••••••••">
        <button type="button" onclick="mostrarSenha(this)" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
      </div>

      <div class="extras">
        <label><input type="checkbox"> Lembrar de mim</label>
        <a href="login.html">Esqueci a senha</a>
      </div>

      <p class="erro-texto" id="erro"></p>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <p class="divisor">Ou continue com</p>
    <div class="sociais">
      <a href="login.html"><i class="bi bi-google"></i>Google</a>
      <a href="login.html"><i class="bi bi-apple"></i>Apple</a>
    </div>
    <p class="criar">Ainda não faz parte? <a href="login.html">Criar conta</a></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
