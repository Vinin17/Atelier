<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos · ATELIER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.dataset.tema = localStorage.getItem('tema') || 'claro';</script>
</head>
<body data-pagina="produtos">
  <header class="topo">
    <div class="esquerda"><button class="icone" onclick="abrirMenu()" aria-label="Abrir menu"><i class="bi bi-list"></i></button></div>
    <a href="index.html" class="marca">ATELIER<span>.</span></a>
    <div class="direita">
      <button class="icone" onclick="abrirMenu()" aria-label="Buscar"><i class="bi bi-search"></i></button>
      <a href="favoritos.html" class="icone so-desktop" aria-label="Favoritos"><i class="bi bi-heart"></i></a>
      <a href="conta.html" class="icone so-desktop" aria-label="Minha conta"><i class="bi bi-person"></i></a>
      <a href="checkout.html" class="icone" aria-label="Sacola"><i class="bi bi-bag"></i><span class="contador">0</span></a>
    </div>
  </header>
  <div class="menu-tela" id="menu" hidden>
    <header class="topo escuro">
      <div class="esquerda"><button class="icone" onclick="fecharMenu()" aria-label="Fechar menu"><i class="bi bi-x-lg"></i></button></div>
      <a href="index.html" class="marca">ATELIER<span>.</span></a>
      <div class="direita">
        <a href="checkout.html" class="icone" aria-label="Sacola"><i class="bi bi-bag"></i></a>
      </div>
    </header>
    <form class="menu-busca" action="produtos.html">
      <div class="busca"><i class="bi bi-search"></i><input type="search" name="busca" placeholder="Buscar coleção, marca ou referência"></div>
    </form>
    <nav class="menu-lista">
      <a href="index.html"><small>01</small>Início<i class="bi bi-arrow-up-right"></i></a>
      <a href="produtos.html?cat=novidades"><small>02</small>Novidades<i class="bi bi-arrow-up-right"></i></a>
      <a href="produtos.html?cat=relogios"><small>03</small>Relógios<i class="bi bi-arrow-up-right"></i></a>
      <a href="produtos.html?cat=acessorios"><small>04</small>Acessórios<i class="bi bi-arrow-up-right"></i></a>
      <a href="produtos.html?cat=ofertas"><small>05</small>Ofertas<i class="bi bi-arrow-up-right"></i></a>
    </nav>
    <a class="jornal" href="produtos.html?cat=novidades">
      <img src="img/Heritage chrono.png" alt="" onerror="this.remove()">
      <div><small>Atelier Journal · 08</small><h3>A arte invisível de um movimento perfeito</h3></div>
      <span>Ler artigo <i class="bi bi-arrow-right"></i></span>
    </a>
    <div class="menu-rodape">
      <a href="conta.html"><i class="bi bi-person"></i> Minha conta</a>
      <span>Brasil · PT <i class="bi bi-chevron-down" style="color:#a09e97"></i></span>
    </div>
  </div>

  <main>
    <section class="cabecalho-pagina">
      <span class="rotulo" id="rotulo"></span>
      <h1 id="titulo"></h1>
      <p id="texto"></p>
    </section>

    <div class="contagem"><strong id="totalPecas"></strong><span id="mostrando"></span></div>

    <div class="acoes">
      <button class="btn-filtro" onclick="alternarFiltro()"><i class="bi bi-sliders"></i> Filtrar</button>
      <div class="ordenar">
        <span>Ordenar:</span>
        <select id="ordem" onchange="desenhar()">
          <option value="relevancia">Relevância</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
        </select>
        <i class="bi bi-chevron-down"></i>
      </div>
    </div>

    <div class="painel" id="filtro" hidden>
      <label for="precoMax" id="precoTexto"></label>
      <input type="range" id="precoMax" min="500" max="30000" step="500" value="30000" oninput="desenhar()">
    </div>

    <div class="grade" id="lista"></div>
    <button class="botao contorno" id="maisPecas" onclick="carregarMais()" style="margin-top:26px">Carregar mais</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
